<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!--
    mindly favicon: a meditating figure on a 16x16 pixel grid.
    Next.js App Router serves app/icon.svg as the favicon automatically.

    HOW TO MODIFY
    - Palette: edit the fills in the <style> block below — one place per color.
    - Shape: every rect is one run of pixels on the 16x16 grid.
      x/y = top-left cell (0-15), width/height = run length in cells.
      Add/remove/move rects freely; keep integer coords so edges stay crisp.
    - The grid legend (col numbers 0-15 left to right, rows top to bottom):
        rows  2-4   head
        row   5     neck / collar
        rows  6-8   shoulders, torso, arms
        row   9     hands resting in lap
        rows 10-12  crossed legs (widening)
        row  13     cushion
  -->
  <style>
    .skin    { fill: #d9b48f; }
    .robe    { fill: #e8b04c; } /* app accent gold */
    .shade   { fill: #b8853a; } /* robe shadow (underside of legs) */
    .cushion { fill: #3a4450; }
  </style>

  <!-- transparent background: just the figure -->

  <!-- head -->
  <rect class="skin" x="6" y="2" width="4" height="3"/>

  <!-- neck / collar -->
  <rect class="robe" x="7" y="5" width="2" height="1"/>

  <!-- shoulders -->
  <rect class="robe" x="6" y="6" width="4" height="1"/>

  <!-- torso with arms at sides -->
  <rect class="robe" x="5" y="7" width="6" height="2"/>

  <!-- hands resting in lap (skin) between robe edges -->
  <rect class="robe" x="5" y="9" width="1" height="1"/>
  <rect class="skin" x="6" y="9" width="4" height="1"/>
  <rect class="robe" x="10" y="9" width="1" height="1"/>

  <!-- crossed legs, widening toward the base -->
  <rect class="robe" x="4" y="10" width="8" height="1"/>
  <rect class="robe" x="2" y="11" width="12" height="1"/>
  <rect class="shade" x="2" y="12" width="12" height="1"/>

  <!-- cushion -->
  <rect class="cushion" x="3" y="13" width="10" height="1"/>
</svg>
