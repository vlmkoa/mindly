# Let's Encrypt ACME issuers (cluster-scoped — applied separately from the
# kustomization, which would wrongly try to namespace them:
#   kubectl apply -f deploy/k8s/issuers.yaml
# Requires cert-manager to be installed first.)
#
# Always dry-run new certs against staging first: prod rate-limits lock the
# domain out for an hour after 5 failed orders, turning a typo into a wait.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ryankhoavo@gmail.com
    privateKeySecretRef:
      name: acme-staging-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ryankhoavo@gmail.com
    privateKeySecretRef:
      name: acme-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
