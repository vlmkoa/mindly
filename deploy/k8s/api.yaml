# FastAPI backend. Stateless by design (sessions + rate counters live in
# Postgres), so the pod is disposable.
#
# strategy: Recreate — two reasons, both deliberate:
# 1. Old code must never run against a newer schema (matters more once the
#    Alembic initContainer lands; the deploy-order rule made permanent).
# 2. A 4GB node shouldn't hold two copies of the app during rollout.
# The cost is a few seconds of API downtime per deploy — invisible at 5 users.
#
# REPLACE before first apply: FRONTEND_ORIGIN value (your real domain).
# The image name is rewritten by kustomization.yaml's images block.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: mindly-api
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mindly-secrets
                  key: DATABASE_URL
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mindly-secrets
                  key: ANTHROPIC_API_KEY
            # Exact scheme+host, no trailing slash. Same-origin means CORS
            # never actually fires in prod, but a wrong value here turns
            # confusing the day you debug with direct API calls.
            - name: FRONTEND_ORIGIN
              value: https://mindly.example.com # REPLACE with real domain
            # Secure cookies: auth only works over https://<domain> from now
            # on — testing against http://<EIP> silently drops the cookie.
            - name: COOKIE_SECURE
              value: "1"
          # /api/health touches no dependencies — exactly what liveness wants:
          # a DB outage should surface as 500s, not restart storms.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 192Mi
              cpu: 50m
            limits:
              memory: 512Mi
